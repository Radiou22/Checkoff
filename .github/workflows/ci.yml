name: CI Checkoff

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Commits conventionnels
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([[:alnum:]_./-]+\))?!?: .+'
          git log --no-merges --format=%s "$BASE..$HEAD" | while IFS= read -r subject; do
            if ! [[ "$subject" =~ $pattern ]]; then
              printf 'Message non conventionnel %s\n' "$subject" >&2
              exit 1
            fi
          done
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm coverage
      - uses: actions/upload-artifact@v4
        with:
          name: checkoff-coverage
          path: apps/*/coverage
  replicas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.coverage.yml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @checkoff/contracts build
      - run: pnpm setup
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Démo HTTPS et plusieurs réplicas
        run: |
          docker compose cp gateway:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/checkoff-ca.crt"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/checkoff-ca.crt" pnpm smoke
      - name: Couverture d’intégration back-end
        run: |
          docker compose stop api job-runner receipt
          docker compose run --rm --no-deps -e NODE_V8_COVERAGE= api pnpm coverage:backend
          mkdir -p coverage
          docker compose cp --index 1 api:/app/coverage-v8/report coverage/backend-e2e
      - uses: actions/upload-artifact@v4
        with:
          name: checkoff-backend-e2e-coverage
          path: coverage/backend-e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
